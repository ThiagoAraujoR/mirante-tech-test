[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirante-modernizer"
version = "0.1.0"
description = "Pipeline híbrido (LLM + Rules) que moderniza stored procedures PL/pgSQL para Python 3.14"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thiago" }]
dependencies = [
    "langgraph>=0.2.50",
    "langgraph-cli[inmem]>=0.1.55",
    "langchain-core>=0.3.0",
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "pglast>=6.0",
    "sqlparse>=0.5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "langfuse>=2.50",
    "httpx>=0.27",
    "tenacity>=8.5",
    "apted>=1.0.3",
    "ruff>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modernizer"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF", "BLE"]
ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
files = ["src/modernizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "live: marca testes que requerem credenciais reais de LLM",
    "integration: marca testes de integração que requerem Postgres",
]
